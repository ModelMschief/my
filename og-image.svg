<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Deep Emerald Background -->
  <rect width="1200" height="630" fill="#064E3B" />
  
  <!-- Subtle Champagne Glow Aura -->
  <circle cx="1000" cy="150" r="350" fill="#F8E7C9" fill-opacity="0.05" filter="blur(80px)" />
  <circle cx="150" cy="500" r="280" fill="#F8E7C9" fill-opacity="0.03" filter="blur(60px)" />

  <!-- Inner Architectural Champagne Border -->
  <rect x="40" y="40" width="1120" height="550" rx="24" stroke="#DFCCA8" stroke-opacity="0.3" stroke-width="2" />
  <rect x="44" y="44" width="1112" height="542" rx="20" stroke="#064E3B" stroke-width="1" />

  <!-- Terminal Corner Markers -->
  <path d="M 60 70 L 60 60 L 70 60" stroke="#F8E7C9" stroke-width="3" stroke-linecap="round" />
  <path d="M 1140 70 L 1140 60 L 1130 60" stroke="#F8E7C9" stroke-width="3" stroke-linecap="round" />
  <path d="M 60 560 L 60 570 L 70 570" stroke="#F8E7C9" stroke-width="3" stroke-linecap="round" />
  <path d="M 1140 560 L 1140 570 L 1130 570" stroke="#F8E7C9" stroke-width="3" stroke-linecap="round" />

  <!-- Monospace Subtitle Tag -->
  <rect x="90" y="110" width="280" height="38" rx="19" fill="#F8E7C9" fill-opacity="0.1" stroke="#DFCCA8" stroke-opacity="0.4" stroke-width="1.5" />
  <circle cx="112" cy="129" r="5" fill="#F8E7C9" />
  <text x="130" y="135" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#F8E7C9" letter-spacing="2">ENGINEERING PORTFOLIO</text>

  <!-- Name & Primary Title -->
  <text x="90" y="240" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="76" font-weight="800" fill="#F8E7C9" letter-spacing="-1">Shebin T R</text>
  <text x="90" y="310" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="34" font-weight="600" fill="#DFCCA8">AI, Computer Vision &amp; Blockchain Architect</text>

  <!-- Descriptive Subtitle -->
  <text x="90" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="400" fill="#F8E7C9" fill-opacity="0.85">High-Throughput APIs • Neural Networks • RAG Pipelines • Multi-Chain Gateways (BSC &amp; TON)</text>

  <!-- Capability Badges at Bottom -->
  <g transform="translate(90, 440)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="42" rx="12" fill="#FAF3E5" fill-opacity="0.12" stroke="#DFCCA8" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="90" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#F8E7C9" text-anchor="middle">Computer Vision</text>

    <!-- Pill 2 -->
    <rect x="195" y="0" width="165" height="42" rx="12" fill="#FAF3E5" fill-opacity="0.12" stroke="#DFCCA8" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="277" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#F8E7C9" text-anchor="middle">Neural Networks</text>

    <!-- Pill 3 -->
    <rect x="375" y="0" width="175" height="42" rx="12" fill="#FAF3E5" fill-opacity="0.12" stroke="#DFCCA8" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="462" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#F8E7C9" text-anchor="middle">RAG &amp; Embeddings</text>

    <!-- Pill 4 -->
    <rect x="565" y="0" width="165" height="42" rx="12" fill="#FAF3E5" fill-opacity="0.12" stroke="#DFCCA8" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="647" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#F8E7C9" text-anchor="middle">BSC &amp; TON Web3</text>

    <!-- Pill 5 -->
    <rect x="745" y="0" width="155" height="42" rx="12" fill="#FAF3E5" fill-opacity="0.12" stroke="#DFCCA8" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="822" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#F8E7C9" text-anchor="middle">FastAPI / Go</text>
  </g>
</svg>
